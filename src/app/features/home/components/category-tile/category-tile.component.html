@let data = category();
<!-- One real button, one accessible name (the category name). The visible label
     is the button's own text content; the icon is decorative (aria-hidden), so
     the name is announced exactly once. -->
<button
  type="button"
  class="category-tile"
  [style.background]="backgroundColor()"
  (click)="onClick()"
>
  <span class="category-tile__label">{{ data.label }}</span>
  <span class="category-tile__icon-wrap" aria-hidden="true">
    <app-icon class="category-tile__icon" [name]="data.iconName" [size]="20" />
  </span>
</button>
