<p-dialog
  [visible]="visible()"
  (visibleChange)="$event === false && closed.emit()"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="auth-dialog"
  appendTo="body"
  (onHide)="onHidden()"
>
  <ng-template pTemplate="header">
    <div class="auth-dialog__drag-handle" aria-hidden="true"></div>
  </ng-template>

  <div class="auth-dialog__body">
    <div
      class="auth-dialog__tabs"
      role="tablist"
      [attr.aria-label]="'auth.dialog.tabsAria' | translate"
    >
      <button
        type="button"
        class="auth-dialog__tab"
        [class.auth-dialog__tab--active]="activeMode() === 'login'"
        role="tab"
        [attr.aria-selected]="activeMode() === 'login'"
        [disabled]="isLoading()"
        (click)="switchToLogin()"
      >
        {{ 'auth.login.title' | translate }}
      </button>
      <button
        type="button"
        class="auth-dialog__tab"
        [class.auth-dialog__tab--active]="activeMode() === 'register'"
        role="tab"
        [attr.aria-selected]="activeMode() === 'register'"
        [disabled]="isLoading()"
        (click)="switchToRegister()"
      >
        {{ 'auth.register.title' | translate }}
      </button>
    </div>

    <!-- Google at the top of BOTH tabs (ADR-030 section 9); only while the dialog is open. -->
    @if (blockMounted()) {
      @for (epoch of [blockEpoch()]; track epoch) {
        <app-google-sign-in-block
          (linkConflict)="onLinkConflict($event)"
          (attempt)="onGoogleAttempt()"
        />
      }
    }

    @if (linkConflictVisible() && activeMode() === 'login') {
      <p-message
        severity="info"
        icon="pi pi-user"
        styleClass="auth-dialog__exists"
        data-testid="google-exists"
      >
        {{ 'auth.google.eExists' | translate }}
      </p-message>
    }

    @if (activeMode() === 'login') {
      <app-login-form [prefill]="loginPrefill()" (switchMode)="switchToRegister()" />
    } @else {
      <app-register-form (switchMode)="switchToLogin()" />
    }
  </div>
</p-dialog>
