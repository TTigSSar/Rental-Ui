<div class="ns__backdrop" (click)="closed.emit()" aria-hidden="true"></div>
<div
  class="ns"
  [class.ns--pinned]="pinnedFooter()"
  [class.ns--dragging]="dragging()"
  [class.ns--snapping]="snapping()"
  [style.transform]="dragOffset() > 0 ? 'translateY(' + dragOffset() + 'px)' : null"
  role="dialog"
  aria-modal="true"
  aria-labelledby="ns-title"
>
  <div
    class="ns__handle-zone"
    aria-hidden="true"
    (pointerdown)="onDragStart($event)"
    (pointermove)="onDragMove($event)"
    (pointerup)="onDragEnd($event)"
    (pointercancel)="onDragCancel($event)"
  >
    <div class="ns__handle"></div>
  </div>
  <div
    class="ns__head"
    (pointerdown)="onDragStart($event)"
    (pointermove)="onDragMove($event)"
    (pointerup)="onDragEnd($event)"
    (pointercancel)="onDragCancel($event)"
  >
    <h2 id="ns-title" class="ns__title">{{ title() }}</h2>
    <button
      type="button"
      class="ns__close"
      [attr.aria-label]="'common.close' | translate"
      (click)="closed.emit()"
    >
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>
  <div class="ns__scroll"><ng-content /></div>
  @if (pinnedFooter()) {
    <div class="ns__foot"><ng-content select="[sheetFooter]" /></div>
  }
</div>
