<app-settings-sheet
  [title]="'profile.settings.password' | translate"
  [pinnedFooter]="true"
  initialFocus=".ps__current input"
  (closed)="requestClose()"
>
  <form class="ps__form" [class.ps__form--busy]="isSubmitting()" [formGroup]="form" novalidate (ngSubmit)="submit()">
    @if (bannerMessageKey(); as key) {
      <div class="ps__banner" role="alert">
        <i class="pi pi-exclamation-circle" aria-hidden="true"></i><span>{{ key | translate }}</span>
      </div>
    } @else if (bannerMessage(); as message) {
      <div class="ps__banner" role="alert">
        <i class="pi pi-exclamation-circle" aria-hidden="true"></i><span>{{ message }}</span>
      </div>
    }

    <app-ui-input
      class="ps__current"
      type="password"
      formControlName="currentPassword"
      [label]="'profile.security.form.currentPassword' | translate"
      [placeholder]="'profile.security.form.currentPasswordPlaceholder' | translate"
      autocomplete="current-password"
      [readonly]="isSubmitting()"
      [errorMessage]="currentPasswordErrorKey() ? (currentPasswordErrorKey() | translate) : null"
      (keydown.enter)="onEnter($event, 0)"
    />

    <app-ui-input
      type="password"
      formControlName="newPassword"
      [label]="'profile.security.form.newPassword' | translate"
      [placeholder]="'profile.security.form.newPasswordPlaceholder' | translate"
      autocomplete="new-password"
      [readonly]="isSubmitting()"
      [errorMessage]="newPasswordErrorKey() ? (newPasswordErrorKey() | translate) : null"
      (keydown.enter)="onEnter($event, 1)"
    />

    <app-ui-input
      type="password"
      formControlName="confirmPassword"
      [label]="'profile.security.form.confirmPassword' | translate"
      [placeholder]="'profile.security.form.confirmPasswordPlaceholder' | translate"
      autocomplete="new-password"
      [readonly]="isSubmitting()"
      [errorMessage]="confirmPasswordErrorKey() ? (confirmPasswordErrorKey() | translate) : null"
      (keydown.enter)="onEnter($event, 2)"
    />
  </form>

  <div sheetFooter class="ps__foot">
    <button type="button" class="ps__btn ps__btn--cancel" [disabled]="isSubmitting()" (click)="requestClose()">
      {{ 'profile.security.form.cancel' | translate }}
    </button>
    <button
      type="button"
      class="ps__btn ps__btn--save"
      [attr.aria-busy]="isSubmitting() ? 'true' : null"
      [attr.aria-label]="isSubmitting() ? ('profile.security.form.saving' | translate) : null"
      (click)="submit()"
    >
      <span class="ps__save-label" [class.ps__save-label--hidden]="isSubmitting()">{{ 'profile.security.form.save' | translate }}</span>
      @if (isSubmitting()) {
        <i class="pi pi-spinner pi-spin ps__spinner" aria-hidden="true"></i>
      }
    </button>
  </div>
</app-settings-sheet>
