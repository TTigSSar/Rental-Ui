<section class="settings-page page-container section-stack">
  <app-ui-page-header
    [title]="'profile.settings.title' | translate"
    backLink="/profile"
    mobileTitleAlign="start"
    [hideOnDesktop]="true"
  />
  <h1 class="settings-page__title">{{ 'profile.settings.title' | translate }}</h1>

  <div class="settings-page__card" role="list">
    @if (passwordManagedByGoogle()) {
      <div class="settings-page__row settings-page__row--inactive" role="listitem" aria-disabled="true">
        <span class="settings-page__icon"><app-icon name="lock" [size]="16" /></span>
        <span class="settings-page__body">
          <span class="settings-page__label">{{ 'profile.settings.password' | translate }}</span>
          <span class="settings-page__hint">{{ 'profile.settings.passwordGoogle' | translate }}</span>
        </span>
      </div>
    } @else {
      <div role="listitem">
        <button
          type="button"
          class="settings-page__row"
          aria-haspopup="dialog"
          data-password-row
          (click)="openPassword()"
        >
          <span class="settings-page__icon"><app-icon name="lock" [size]="16" /></span>
          <span class="settings-page__body">
            <span class="settings-page__label">{{ 'profile.settings.password' | translate }}</span>
          </span>
          <app-icon name="chevron-right" [size]="13" class="settings-page__chevron" />
        </button>
      </div>
    }

    <div role="listitem">
      <button
        type="button"
        class="settings-page__row"
        aria-haspopup="dialog"
        data-language-row
        (click)="openLanguage()"
      >
        <span class="settings-page__icon"><app-icon name="glob" [size]="16" /></span>
        <span class="settings-page__body">
          <span class="settings-page__label">{{ 'profile.settings.language' | translate }}</span>
        </span>
        <span class="settings-page__value">{{ currentLang().native }}</span>
        <app-icon name="chevron-right" [size]="13" class="settings-page__chevron" />
      </button>
    </div>

    <div role="listitem">
      <button
        type="button"
        class="settings-page__row"
        aria-haspopup="dialog"
        data-notifications-row
        (click)="openNotifications()"
      >
        <span class="settings-page__icon"><app-icon name="bell" [size]="16" /></span>
        <span class="settings-page__body">
          <span class="settings-page__label">{{ 'profile.settings.notifications' | translate }}</span>
        </span>
        <app-icon name="chevron-right" [size]="13" class="settings-page__chevron" />
      </button>
    </div>
  </div>

  @if (canDeleteAccount()) {
    <div class="settings-page__danger-slot">
      <div class="settings-page__card" role="list">
        <button
          type="button"
          class="settings-page__row settings-page__row--danger"
          role="listitem"
          data-testid="delete-account-row"
          aria-haspopup="dialog"
          (click)="openDeleteDialog()"
        >
          <span class="settings-page__icon settings-page__icon--danger">
            <i class="pi pi-trash" aria-hidden="true"></i>
          </span>
          <span class="settings-page__body">
            <span class="settings-page__label">{{ 'profile.settings.deleteAccount' | translate }}</span>
          </span>
          <app-icon name="chevron-right" [size]="13" class="settings-page__chevron" />
        </button>
      </div>
    </div>

    <app-delete-account-dialog
      [visible]="deleteDialogOpen()"
      [hasPassword]="!passwordManagedByGoogle()"
      (closed)="closeDeleteDialog()"
    />
  }
</section>

@if (notificationsOpen()) {
  <app-notifications-sheet (closed)="closeNotifications()" />
}

@if (passwordOpen()) {
  <app-password-sheet (closed)="closePassword()" />
}

@if (languageOpen()) {
  <app-language-sheet
    [languages]="availableLanguages"
    [currentCode]="currentLang().code"
    (selected)="selectLanguage($event)"
    (closed)="closeLanguage()"
  />
}
