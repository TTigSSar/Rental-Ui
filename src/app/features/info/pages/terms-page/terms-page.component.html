<div class="info-page">

  <!-- Hero -->
  <header class="info-page__hero">
    <span class="info-page__hero-icon" aria-hidden="true">
      <i class="pi pi-file-edit"></i>
    </span>
    <h1 class="info-page__hero-title">{{ 'info.terms.heroTitle' | translate }}</h1>
    <p class="info-page__hero-meta">{{ 'info.terms.lastUpdated' | translate }}</p>
  </header>

  <div class="info-page__container">
    <!-- Section 7 (zero-based 6) is the payments disclaimer, drawn as the highlighted panel -->
    <app-legal-document translationKey="info.terms" [highlightSection]="6" />
  </div>
</div>
