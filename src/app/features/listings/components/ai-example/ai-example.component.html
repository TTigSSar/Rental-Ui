@if (visible()) {
  @if (withHint()) {
    <p class="aiex__line">
      {{ 'listings.ai.hintPrefix' | translate }}
      <button type="button" class="aiex__link" (click)="use()">{{ 'listings.ai.hintExample' | translate }}</button>
    </p>
  } @else {
    <div class="aiex">
      <button type="button" class="aiex__btn" (click)="use()">
        <span class="aiex__label">{{ 'listings.ai.exampleLabel' | translate }}</span>
        <span class="aiex__text">“{{ 'listings.ai.exampleShort' | translate }}”</span>
      </button>
    </div>
  }
}
