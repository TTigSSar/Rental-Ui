<p-dialog
  [header]="'bookings.reject.title' | translate"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [dismissableMask]="true"
  appendTo="body"
  [style]="{ width: '92vw', maxWidth: '420px' }"
>
  <p class="booking-reject__desc">{{ 'bookings.reject.description' | translate }}</p>

  <fieldset class="booking-reject__fieldset">
    <legend class="booking-reject__visually-hidden">
      {{ 'bookings.reject.reasonLabel' | translate }}
    </legend>
    <div class="booking-reject__options">
      @for (code of reasonCodes; track code) {
        <label class="booking-reject__option">
          <input
            type="radio"
            name="rejectReason"
            [value]="code"
            [checked]="selectedReason() === code"
            (change)="onReasonChange(code)"
          />
          <span>{{ 'bookings.rejectReason.' + code | translate }}</span>
        </label>
      }
    </div>
  </fieldset>

  @if (selectedReason() === 'other') {
    <label class="booking-reject__visually-hidden" for="booking-reject-other">
      {{ 'bookings.reject.otherLabel' | translate }}
    </label>
    <textarea
      id="booking-reject-other"
      class="booking-reject__note"
      rows="3"
      maxlength="500"
      [value]="otherText()"
      (input)="onOtherInput($event)"
      [placeholder]="'bookings.reject.otherPlaceholder' | translate"
    ></textarea>
  }

  <ng-template pTemplate="footer">
    <p-button
      type="button"
      [text]="true"
      [label]="'bookings.reject.cancel' | translate"
      (onClick)="cancel()"
    />
    <p-button
      type="button"
      severity="danger"
      [label]="'bookings.reject.confirm' | translate"
      [disabled]="selectedReason() === 'other' && otherText().trim().length === 0"
      (onClick)="confirm()"
    />
  </ng-template>
</p-dialog>
