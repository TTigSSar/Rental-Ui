<div class="brc" (click)="openDetails()">

  <!-- Renter avatar column -->
  <div class="brc__renter">
    <div class="brc__avatar">{{ initials() }}</div>
    <span class="brc__renter-name">{{ renterShortName() }}</span>
  </div>

  <!-- Main content -->
  <div class="brc__body">
    <div class="brc__header">
      <h3 class="brc__title">{{ request().listingTitle }}</h3>
      <span class="brc__time">{{ timeAgo() }}</span>
    </div>
    <p class="brc__meta">
      <i class="pi pi-calendar"></i>
      {{ request().startDate | date: 'MMM d' }} – {{ request().endDate | date: 'MMM d' }}
      &middot;
      {{ request().totalPrice | dram }}
    </p>

    @if (canDecide()) {
      <div class="brc__actions" (click)="$event.stopPropagation()">
        <button type="button" class="brc__btn brc__btn--message" disabled>
          {{ 'bookings.actions.message' | translate }}
        </button>
        <button
          type="button"
          class="brc__btn brc__btn--decline"
          [disabled]="actionLoading()"
          (click)="openRejectDialog($event)"
        >
          {{ 'bookings.actions.reject' | translate }}
        </button>
        <button
          type="button"
          class="brc__btn brc__btn--approve"
          [disabled]="actionLoading()"
          (click)="approve($event)"
        >
          <i class="pi pi-check"></i>
          {{ 'bookings.actions.approve' | translate }}
        </button>
      </div>
    } @else {
      <p class="brc__hint">{{ 'bookings.actions.viewDetails' | translate }}</p>
    }
  </div>

</div>

<!-- Reject dialog (shared across every owner surface — see M-042) -->
<app-booking-reject-dialog
  [visible]="rejectDialogVisible()"
  (confirmed)="confirmReject($event)"
  (cancelled)="cancelReject()"
/>
